- title: "Sustainability in Action: Technovation Cambodia 10 years on"
  pub: "Digital"
  date: 2024-11-21
  link: "https://dai-global-digital.com/sustainability-in-action-technovation-cambodia-10-years-on.html?utm_source=daidotcom"
  summary: "Searching online for the word “sustainability” yields 500+ results on the U.S. Agency for International Development’s (USAID) Learning Lab website, 5,000+ results on USAID.gov, and a whopping 80,000+ results on the Development Experience Clearinghouse (DEC). Developing and implementing sustainable interventions—those that continue beyond the life of the donor-funded programs that designed, implemented, and/or funded them—is a core focus of donors and implementing partners around the world. However, given the short time horizons of many programs, the truth is that we often do not know what happens to initiatives after funding them.

Today, we highlight a sustainability story that USAID also recognized in its Enduring Results Study 4.0—the 10-year anniversary of Technovation Cambodia (five years under the Development Innovations (DI) project and five years under the leadership of Cambodian organizers with no bilateral donor support)."
