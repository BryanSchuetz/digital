
- title: "Three Approaches to Cybersecurity Preparedness—Highlights from RSA Conference 2024"
  pub: "Digital"
  date: 2024-08-08
  link: "https://dai-global-digital.com/three-approaches-to-cybersecurity-preparedness-highlights-from-rsa-conference-2024.html?utm_source=daidotcom"
  summary: "In 2023, there were an estimated 2,365 cyberattacks. On top of this, there is a global shortage of at least 4 million cybersecurity professionals. The World Economic Forum and Accenture 2024 Global Security Outlook reports that 71 percent of organizations have unfilled cybersecurity positions. Cybersecurity preparedness is critical for preventing and responding to future attacks and without a skilled workforce, investments will fall short. In May, DAI hosted two sessions and joined international cybersecurity stakeholders at the RSA Conference (RSAC). At the conference, various approaches for boosting cybersecurity preparedness were discussed, including integrating human-centered practices, introducing tabletop exercises, and dedicating resources to target-rich, cyber-poor organizations."
