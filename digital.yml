    - Resilience 

- title: "Here’s How to Harness the Top Gun Effect to Find the Next Generation of Cyber Talent"
  pub: "Digital"
  date: 2024-05-16
  link: "https://dai-global-digital.com/heres-how-to-harness-the-top-gun-effect-to-find-the-next-generation-of-cyber-talent.html?utm_source=daidotcom"
  summary: "This post first appeared on the World Economic Forum blog.

“Top Gun,” the classic tale of fearless test pilot-turned-hero Maverick, pushed cinema boundaries with audiences back in 1986—so much so that, in the year following the movie’s box-office success, the U.S. Navy claimed its recruitment swelled by a massive 500 percent. How does this translate to cybersecurity where the global shortfall of cybersecurity workers has reached 4 million?

We need a spark—with an energy equal to that iconic ’80s flick—that could inspire future leaders to guide citizens and businesses alike on how they can mitigate cyber risks, implement comprehensive cybersecurity strategies, and increase their cyber resilience. While there is no silver bullet to solve the talent gap issue, the global shortfall speaks to a more urgent need to implement fresh and innovative methods that can inspire, encourage, and foster a new generation of cybersecurity talent.

Photo: USAID Colombia."
  tags:
    - digital acceleration 
    - Cybersecurity 
    - digital economy 

- title: "Why Cybersecurity Matters for Development: Lessons from the Field"
  pub: "Digital"
  date: 2024-05-03
  link: "https://dai-global-digital.com/why-cybersecurity-matters-for-development-lessons-from-the-field.html?utm_source=daidotcom"
  summary: "In December 2023, millions of Ukrainians lost cell service for days after Russia carried out a cyberattack on Kyivstar, Ukraine’s largest telecom operator. But malign actors do not reserve cyberattacks for wartime; in September 2022, international hacker group BlackByte cyberattacked the electronic systems of North Macedonia’s Ministry of Agriculture, Forestry, and Water Management, taking systems offline across the ministry.

As governments across the world adopt e-services, this creates new entry points for malign actors to utilize cyberattacks for motives such as financial gain, political protest, or destabilization. This is especially true in Eastern Europe, where countries face cyberattacks both as part of Russia’s invasion of Ukraine and by various malign actors. On May 6–9, during the RSA Conference in San Francisco, two U.S. Agency for International Development (USAID) projects will host sessions drawing on country-level experiences to demonstrate the importance of cybersecurity as a development priority. See details below."
  tags:
