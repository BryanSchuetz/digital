- title: "E-Governance Platforms Must be Cyber-Secure to Ensure Essential Services"
  pub: "Digital"
  date: 2024-10-31
  link: "https://dai-global-digital.com/E-Governance-Platforms-Must-be-Cyber-Secure-to-Ensure-Essential-Services.html?utm_source=daidotcom"
  summary: "On August 22, 2022, hackers attacked more than 80 Moldovan government web portals to shut down key elements of the e-governance platform used by citizens and businesses. Similar attacks soon followed across the region, including ones targeting government portals in Albania, Kosovo, and Montenegro.

As part of their responses to this threat, governments in the Western Balkans and Eastern Europe partnered with the U.S. Agency for International Development (USAID)’s Critical Infrastructure Digitalization and Resilience (CIDR) program, implemented by DAI. Among its cybersecurity development activities, CIDR works with governments to build capacity to reduce cyber threats to e-governance platforms.

Photo: Wikimedia Commons."
