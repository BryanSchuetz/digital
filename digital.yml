
- title: "Why Cybersecurity Matters for Development: Lessons from the Field"
  pub: "Digital"
  date: 2024-05-03
  link: "https://dai-global-digital.com/why-cybersecurity-matters-for-development-lessons-from-the-field.html?utm_source=daidotcom"
  summary: "In December 2023, millions of Ukrainians lost cell service for days after Russia carried out a cyberattack on Kyivstar, Ukraine’s largest telecom operator. But malign actors do not reserve cyberattacks for wartime; in September 2022, international hacker group BlackByte cyberattacked the electronic systems of North Macedonia’s Ministry of Agriculture, Forestry, and Water Management, taking systems offline across the ministry.

As governments across the world adopt e-services, this creates new entry points for malign actors to utilize cyberattacks for motives such as financial gain, political protest, or destabilization. This is especially true in Eastern Europe, where countries face cyberattacks both as part of Russia’s invasion of Ukraine and by various malign actors. On May 6–9, during the RSA Conference in San Francisco, two U.S. Agency for International Development (USAID) projects will host sessions drawing on country-level experiences to demonstrate the importance of cybersecurity as a development priority."
  tags:
