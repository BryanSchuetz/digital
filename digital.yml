- title: "“We, The Data” Holds a Human Rights Lens to the Digital Age"
  pub: "Digital"
  date: 2024-08-22
  link: "https://dai-global-digital.com/we-the-data-holds-a-human-rights-lens-to-the-digital-age.html?utm_source=daidotcom"
  summary: "In “We, The Data,” author Wendy H. Wong looks at the applicability of human rights to the digital age, making the case for extending the application of human rights outside of our physical bodies. She explores the extensive implications of datafication on our rights and what actions we, as data creators and subjects, need to take to protect these rights. She notes that a focus on human rights gets us to the core of why regulating datafication matters and provides us with globally accepted values through which to talk about it.

Exploring data rights, facial recognition technology, human rights after death, big tech, and data literacy, Wong makes the case for collective engagement as stakeholders to hold data collectors and processors to account."
  tags:
    - digital acceleration 
    - Digital Democracy Series 
    - Data 

- title: "Three Approaches to Cybersecurity Preparedness—Highlights from RSA Conference 2024"
  pub: "Digital"
  date: 2024-08-08
  link: "https://dai-global-digital.com/three-approaches-to-cybersecurity-preparedness-highlights-from-rsa-conference-2024.html?utm_source=daidotcom"
  summary: "In 2023, there were an estimated 2,365 cyberattacks. On top of this, there is a global shortage of at least 4 million cybersecurity professionals. The World Economic Forum and Accenture 2024 Global Security Outlook reports that 71 percent of organizations have unfilled cybersecurity positions. Cybersecurity preparedness is critical for preventing and responding to future attacks and without a skilled workforce, investments will fall short. In May, DAI hosted two sessions and joined international cybersecurity stakeholders at the RSA Conference (RSAC). At the conference, various approaches for boosting cybersecurity preparedness were discussed, including integrating human-centered practices, introducing tabletop exercises, and dedicating resources to target-rich, cyber-poor organizations."
  tags:
