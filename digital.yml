- title: "Digital Rights and the Technology Workforce: Why Do We Need Our Technology Professionals to be Informed on Human Rights?"
  pub: "Digital"
  date: 2024-07-11
  link: "https://dai-global-digital.com/digital-rights-and-the-technology-workforce-why-do-we-need-our-technology-professionals-to-be-informed-on-human-rights.html?utm_source=daidotcom"
  summary: "We are in a digital revolution, from which governments, economies, and individuals are poised to reap many benefits. Local workforce development is inextricably linked to this revolution on a country’s economy because governments and the private sector will be unable to benefit without a capable workforce in place. Many developing countries have a growing and vibrant technology workforce, but workforce needs are often mismatched with local expertise. This is in part due to brain drain of the brightest talent—due to hopes for a better quality of life, limited opportunities in domestic markets, and fierce international competition for technology-related skills. Gaps in technology-related formal and informal education are also a challenge, whereby market needs are not met by domestic formal education. This is not just exclusive to developing countries: There are global shortages of skills including cybersecurity (estimated at a gap of 3.4 million experts globally), deep learning, natural language processing, and robotic process automation. Digital skills gaps in these areas can have significant implications for economic development, technological progress, and national security.

Photo: USAID Nigeria."
